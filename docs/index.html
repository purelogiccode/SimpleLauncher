<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Launcher — Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link id="theme-style" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
    <link rel="stylesheet" href="site.css">
    <script>
        // Apply the saved theme before the page paints to avoid a flash.
        // "?theme=light" / "?theme=dark" in the URL sets (and persists) the choice too.
        (function () {
            var requested = new URLSearchParams(location.search).get('theme');
            if (requested === 'light' || requested === 'dark') {
                localStorage.setItem('sl-docs-theme', requested);
            }
            if (localStorage.getItem('sl-docs-theme') === 'light') {
                document.getElementById('theme-style').href =
                    'https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css';
            }
        })();
    </script>
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
      name: 'Simple Launcher',
      repo: 'https://github.com/purelogiccode/SimpleLauncher',
      loadSidebar: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: 'auto',
      themeColor: '#58a6ff'
    };
  </script>
<button id="theme-toggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">☀️</button>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script>
    (function () {
        var DARK = 'https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css';
        var LIGHT = 'https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css';
        var link = document.getElementById('theme-style');
        var btn = document.getElementById('theme-toggle');
        var dark = localStorage.getItem('sl-docs-theme') !== 'light';

        function apply() {
            link.href = dark ? DARK : LIGHT;
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            document.body.classList.toggle('sl-light', !dark);
            var label = dark ? 'Switch to light theme' : 'Switch to dark theme';
            btn.textContent = dark ? '☀️' : '🌙';
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        btn.addEventListener('click', function () {
            dark = !dark;
            localStorage.setItem('sl-docs-theme', dark ? 'dark' : 'light');
            apply();
        });

        apply();
    })();
</script>
</body>
</html>
