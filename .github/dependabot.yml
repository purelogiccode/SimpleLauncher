version: 2

updates:
  # .NET / NuGet packages across every project in the solution.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps usually need a manual migration (WPF/Avalonia/NAudio); keep them manual.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions used by ci.yml, docs.yml, package-dry-run.yml and release.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
