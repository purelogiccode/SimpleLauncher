name: Publish Avalonia release

# Manual release: packages the Avalonia app for win-x64 and win-arm64 via
# scripts/package-release.ps1 -App Avalonia (-OutputDir/-WorkDir override the defaults)
# and creates/updates the GitHub release the in-app updater reads.
# The assets carry the "avalonia_" prefix (release_avalonia_{version}_{rid}.zip,
# updater_avalonia_{rid}.zip) so they share the release tag with the WPF packages
# produced by release-wpf.yml without overwriting them.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, must match the csproj (e.g. 5.7.0)'
        required: true
        type: string
      create_release:
        description: 'Create or update the GitHub release and attach the packages'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Optional release notes (markdown). Leave empty to auto-generate.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package Avalonia (win-x64, win-arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./scripts/package-release.ps1
          -Version $env:VERSION
          -App Avalonia
          -OutputDir '${{ github.workspace }}/artifacts/release-avalonia'
          -WorkDir '${{ runner.temp }}/sl-publish-avalonia'

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simplelauncher-avalonia-${{ inputs.version }}
          path: artifacts/release-avalonia/*.zip
          retention-days: 7

      - name: Create or update GitHub release
        if: ${{ inputs.create_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $tag = "release$env:VERSION"
          $assets = Get-ChildItem -LiteralPath 'artifacts/release-avalonia' -Filter '*.zip' | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --generate-notes
            }
            else {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $env:RELEASE_NOTES -Encoding utf8
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --notes-file $notesFile
            }
          }
          else {
            Write-Host "Release $tag already exists, updating its assets"
          }

          gh release upload $tag $assets --clobber
