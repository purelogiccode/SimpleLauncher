name: Publish release

# Manual release. Packages:
#
#   Windows (windows-latest)  win-x64 / win-arm64 portable ZIPs, updater ZIPs and
#                             per-user Inno Setup installers via
#                             scripts/package-release.ps1 -BuildInstaller
#   Linux   (ubuntu-latest)   linux-x64 / linux-arm64 framework-dependent ZIP + tar.gz,
#                             self-contained AppImage and Flatpak, and the updater ZIPs
#                             via scripts/package-release-linux.ps1 +
#                             scripts/package-linux-native.sh
#   macOS   (macos-15, arm64) osx-arm64 self-contained `.app` inside an unsigned DMG
#                             via scripts/package-release-macos.ps1
#
# The publish job then creates/updates the GitHub release the in-app updater reads,
# uploads every asset and mirrors the same files to the Cloudflare R2 fallback with
# scripts/publish-fallback-r2.ps1 (the macOS DMG is mirrored too).
#
# Assets produced per RID:
#   release_{version}_{rid}.zip        Windows: Avalonia payload as SimpleLauncher.exe
#                                      Linux:   framework-dependent SimpleLauncher.Avalonia payload
#   release_{version}_{rid}.tar.gz     Linux:   the same portable payload as a tarball
#   updater_{rid}.zip                  the standalone updater shared by the apps
#   SimpleLauncher-{version}-{rid}-setup.exe  Windows: per-user Inno Setup installer
#   SimpleLauncher-{version}-{rid}.AppImage   Linux: self-contained (bundled .NET runtime)
#   SimpleLauncher-{version}-{rid}.flatpak    Linux: Flatpak bundle (org.freedesktop.Platform)
#   SimpleLauncher-{version}-osx-arm64.dmg    macOS: unsigned, ad-hoc signed `.app`
#                                             (no notarization; manual updates)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, must match the csproj (e.g. 5.8.1)'
        required: true
        type: string
      create_release:
        description: 'Create or update the GitHub release and attach the packages'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Optional release notes (markdown). Leave empty to auto-generate.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows bundles
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package Windows release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./scripts/package-release.ps1
          -Version $env:VERSION
          -BuildInstaller
          -OutputDir '${{ github.workspace }}/artifacts/release'
          -WorkDir '${{ runner.temp }}/sl-publish'

      - name: Verify Windows installer and portable artifacts
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($rid in @('win-x64', 'win-arm64')) {
            $path = Join-Path 'artifacts/release' "SimpleLauncher-$($env:VERSION)-$rid-setup.exe"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing installer: $path"
            }
            $sizeMb = [math]::Round((Get-Item -LiteralPath $path).Length / 1MB, 1)
            if ($sizeMb -lt 20) {
              throw "Installer looks too small ($sizeMb MB): $path"
            }
            Write-Host "$path ($sizeMb MB)"

            $zip = Join-Path 'artifacts/release' "release_$($env:VERSION)_$rid.zip"
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            try {
              $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            }
            finally {
              $archive.Dispose()
            }
            if ($entries -notcontains 'SimpleLauncher.exe') {
              throw "The Windows bundle is missing SimpleLauncher.exe: $zip"
            }
            if ($entries -contains 'SimpleLauncher.Avalonia.exe') {
              throw "The Windows bundle still ships the old SimpleLauncher.Avalonia.exe name: $zip"
            }
            if ($entries | Where-Object { $_ -like '*.pdb' }) {
              throw "The Windows bundle ships debug symbols: $zip"
            }
            $expectedTools = @('CHDMounter', 'RetroAchievementsSharp', 'SimpleXisoDrive', 'SimpleZipDrive')
            foreach ($tool in $expectedTools) {
              if (-not ($entries | Where-Object { $_ -like "tools/$tool/$rid/*" })) {
                throw "The Windows bundle is missing tools/$tool/$rid: $zip"
              }
            }
            $sevenZip = if ($rid -eq 'win-arm64') { '7za_arm64.exe' } else { '7za.exe' }
            if ($entries -notcontains "tools/SevenZip/$sevenZip") {
              throw "The Windows bundle is missing tools/SevenZip/$sevenZip: $zip"
            }

            $extractedExe = Join-Path $env:RUNNER_TEMP "sl-$rid.exe"
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            try {
              $archive.GetEntry('SimpleLauncher.exe').ExtractToFile($extractedExe, $true)
            }
            finally {
              $archive.Dispose()
            }
            $stream = [System.IO.File]::OpenRead($extractedExe)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              $machine = $reader.ReadUInt16()
            }
            finally {
              $stream.Dispose()
            }
            $expectedMachine = if ($rid -eq 'win-arm64') { 0xAA64 } else { 0x8664 }
            if ($machine -ne $expectedMachine) {
              throw ("SimpleLauncher.exe has PE machine 0x{0:X4}, expected 0x{1:X4}: {2}" -f $machine, $expectedMachine, $zip)
            }
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: simplelauncher-windows-${{ inputs.version }}
          path: artifacts/release/*
          retention-days: 7

  package-linux:
    name: Package Linux bundles (zip, tar.gz, AppImage, Flatpak)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install Flatpak runtimes (x86_64 and aarch64)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          sudo flatpak install -y --arch=aarch64 flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Package portable Linux bundles
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./scripts/package-release-linux.ps1
          -Version $env:VERSION
          -BuildSelfContainedPayload
          -OutputDir '${{ github.workspace }}/artifacts/release'
          -WorkDir '${{ runner.temp }}/sl-publish-linux'

      - name: Package native Linux bundles (AppImage + Flatpak)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64; do
            ./scripts/package-linux-native.sh \
              --version "$VERSION" \
              --rid "$rid" \
              --payload "$RUNNER_TEMP/sl-publish-linux/$rid/selfcontained" \
              --output artifacts/release \
              --work "$RUNNER_TEMP/sl-native-$rid"
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: simplelauncher-linux-${{ inputs.version }}
          path: artifacts/release/*
          retention-days: 7

  package-macos:
    name: Package macOS arm64 DMG
    # macos-15 is the arm64 (Apple Silicon) GitHub-hosted runner. The bundle is
    # unsigned (ad-hoc signature only) and is not notarized, so no Apple Developer
    # certificate is needed on the runner.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Package macOS DMG
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          ./scripts/package-release-macos.ps1
          -Version $env:VERSION
          -OutputDir '${{ github.workspace }}/artifacts/release'
          -WorkDir '${{ runner.temp }}/sl-publish-macos'

      - name: Verify the DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls artifacts/release/SimpleLauncher-*-osx-arm64.dmg)
          test -f "$dmg"
          hdiutil verify "$dmg"

          mount=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach -quiet "$mount" || true' EXIT
          test -d "$mount/Simple Launcher.app"
          test -x "$mount/Simple Launcher.app/Contents/MacOS/SimpleLauncher.Avalonia"
          test -f "$mount/Simple Launcher.app/Contents/Info.plist"
          test -L "$mount/Applications"
          echo "macOS DMG is valid."

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: simplelauncher-macos-${{ inputs.version }}
          path: artifacts/release/*
          retention-days: 7

  verify-linux:
    name: Verify Linux packages
    needs: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: simplelauncher-linux-${{ inputs.version }}
          path: artifacts

      - name: Install Flatpak tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check the archives, executable bits and bundle architectures
        shell: bash
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64; do
            unzip -q artifacts/release_*_${rid}.zip -d "app-${rid}"
            test -x "app-${rid}/SimpleLauncher.Avalonia"
            test -f "app-${rid}/appsettings.json"
            test -f "app-${rid}/LICENSE.txt"

            mkdir -p "tar-${rid}"
            tar -xzf artifacts/release_*_${rid}.tar.gz -C "tar-${rid}"
            test -x "tar-${rid}/SimpleLauncher.Avalonia"
            if [[ "$rid" == linux-x64 ]]; then sevenzip=7zz; else sevenzip=7zz_arm64; fi
            test -x "tar-${rid}/tools/SevenZip/${sevenzip}"

            unzip -q "artifacts/updater_${rid}.zip" -d "updater-${rid}"
            test -x "updater-${rid}/Updater"
          done

          file artifacts/SimpleLauncher-*-linux-x64.AppImage | grep -q 'ELF 64-bit'
          file artifacts/SimpleLauncher-*-linux-arm64.AppImage | grep -q 'ARM aarch64'
          for image in artifacts/SimpleLauncher-*-linux-*.AppImage; do
            test "$(stat -c%s "$image")" -gt 50000000
          done

          for rid in linux-x64 linux-arm64; do
            if [[ "$rid" == linux-x64 ]]; then arch=x86_64; else arch=aarch64; fi
            repo="$RUNNER_TEMP/flatpak-repo-${rid}"
            ostree init --repo="$repo" --mode=archive
            flatpak build-import-bundle "$repo" artifacts/SimpleLauncher-*-${rid}.flatpak
            ostree --repo="$repo" refs | grep -q "app/com.purelogiccode.SimpleLauncher/${arch}/master"
          done

          echo "Linux archives, executable bits, AppImages and Flatpak bundles are valid."

  publish:
    name: Create release and publish fallback
    needs:
      - package-windows
      - package-linux
      - verify-linux
      - package-macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: simplelauncher-windows-${{ inputs.version }}
          path: artifacts/release

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: simplelauncher-linux-${{ inputs.version }}
          path: artifacts/release

      - name: Download macOS packages
        uses: actions/download-artifact@v8
        with:
          name: simplelauncher-macos-${{ inputs.version }}
          path: artifacts/release

      - name: Verify every release asset is present
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $expected = @(
            "release_$($env:VERSION)_win-x64.zip"
            "release_$($env:VERSION)_win-arm64.zip"
            "release_$($env:VERSION)_linux-x64.zip"
            "release_$($env:VERSION)_linux-arm64.zip"
            "release_$($env:VERSION)_linux-x64.tar.gz"
            "release_$($env:VERSION)_linux-arm64.tar.gz"
            "updater_win-x64.zip"
            "updater_win-arm64.zip"
            "updater_linux-x64.zip"
            "updater_linux-arm64.zip"
            "SimpleLauncher-$($env:VERSION)-win-x64-setup.exe"
            "SimpleLauncher-$($env:VERSION)-win-arm64-setup.exe"
            "SimpleLauncher-$($env:VERSION)-linux-x64.AppImage"
            "SimpleLauncher-$($env:VERSION)-linux-arm64.AppImage"
            "SimpleLauncher-$($env:VERSION)-linux-x64.flatpak"
            "SimpleLauncher-$($env:VERSION)-linux-arm64.flatpak"
            "SimpleLauncher-$($env:VERSION)-osx-arm64.dmg"
          )

          $missing = @($expected | Where-Object {
              -not (Test-Path -LiteralPath (Join-Path 'artifacts/release' $_))
            })
          if ($missing.Count -gt 0) {
            throw "Missing release assets: $($missing -join ', ')"
          }

          Get-ChildItem -LiteralPath 'artifacts/release' |
            Sort-Object Name |
            Select-Object Name, @{ Name = 'MB'; Expression = { [math]::Round($_.Length / 1MB, 1) } } |
            Format-Table -AutoSize

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath 'artifacts/release' -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name)
          if ($files.Count -eq 0) {
            throw 'No release assets were found in artifacts/release.'
          }

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }

          Set-Content -LiteralPath 'artifacts/release/SHA256SUMS.txt' -Value $lines -Encoding ascii
          Get-Content -LiteralPath 'artifacts/release/SHA256SUMS.txt'

      - name: Create or update GitHub release
        if: ${{ inputs.create_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $tag = "release$env:VERSION"
          $assets = Get-ChildItem -LiteralPath 'artifacts/release' -File | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --generate-notes
            }
            else {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $env:RELEASE_NOTES -Encoding utf8
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --notes-file $notesFile
            }
          }
          else {
            Write-Host "Release $tag already exists, updating its assets"
          }

          gh release upload $tag $assets --clobber

      - name: Publish download fallback to Cloudflare R2
        if: ${{ inputs.create_release }}
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: >
          ./scripts/publish-fallback-r2.ps1
          -Version $env:VERSION
          -ReleaseDir '${{ github.workspace }}/artifacts/release'
