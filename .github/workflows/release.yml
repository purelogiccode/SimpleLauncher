name: Publish release

# Manual release: packages the Windows WPF + Avalonia bundle for win-x64 and win-arm64 via
# scripts/package-release.ps1 and the framework-dependent Linux bundle for linux-x64 and linux-arm64
# via scripts/package-release-linux.ps1, uploads the zips as workflow artifacts,
# creates/updates the GitHub release the in-app updater reads, and mirrors the same
# assets to the Cloudflare R2 download fallback with scripts/publish-fallback-r2.ps1.
#
# Assets produced per RID:
#   release_{version}_{rid}.zip   Windows: SimpleLauncher.exe + SimpleLauncher.Avalonia.exe side by side
#                                 Linux:   the framework-dependent SimpleLauncher.Avalonia payload
#   updater_{rid}.zip             the standalone updater shared by the apps (Updater.exe / Updater)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, must match the csproj (e.g. 5.8.1)'
        required: true
        type: string
      create_release:
        description: 'Create or update the GitHub release and attach the packages'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Optional release notes (markdown). Leave empty to auto-generate.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package release bundles (win-x64, win-arm64, linux-x64, linux-arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package Windows release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./scripts/package-release.ps1
          -Version $env:VERSION
          -OutputDir '${{ github.workspace }}/artifacts/release'
          -WorkDir '${{ runner.temp }}/sl-publish'

      - name: Package Linux release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./scripts/package-release-linux.ps1
          -Version $env:VERSION
          -OutputDir '${{ github.workspace }}/artifacts/release'
          -WorkDir '${{ runner.temp }}/sl-publish-linux'

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simplelauncher-${{ inputs.version }}
          path: artifacts/release/*.zip
          retention-days: 7

      - name: Create or update GitHub release
        if: ${{ inputs.create_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $tag = "release$env:VERSION"
          $assets = Get-ChildItem -LiteralPath 'artifacts/release' -Filter '*.zip' | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --generate-notes
            }
            else {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $env:RELEASE_NOTES -Encoding utf8
              gh release create $tag --target $env:GITHUB_SHA --title "Version $env:VERSION" --notes-file $notesFile
            }
          }
          else {
            Write-Host "Release $tag already exists, updating its assets"
          }

          gh release upload $tag $assets --clobber

      - name: Publish download fallback to Cloudflare R2
        if: ${{ inputs.create_release }}
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: >
          ./scripts/publish-fallback-r2.ps1
          -Version $env:VERSION
          -ReleaseDir '${{ github.workspace }}/artifacts/release'
